<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balaji UPVC Windows & Doors</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:linear-gradient(135deg,#ff6600,#ff944d);
}

/* NAVBAR */
header{
  position:fixed;
  width:100%;
  top:0;
  background:rgba(0,0,0,0.7);
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}

header h1{
  color:#fff;
}

nav a{
  color:#fff;
  margin-left:20px;
  text-decoration:none;
  transition:0.3s;
}

nav a:hover{
  color:#ff944d;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:#fff;
  text-align:center;
  padding:20px;
}

/* SECTION */
.section{
  padding:80px 20px;
  background:#fff;
  text-align:center;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
  margin-top:40px;
}

/* CARD INITIAL STATE */
.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  transform:translateY(60px);
  opacity:0;
  transition:all 0.8s ease;
}

/* CARD WHEN VISIBLE */
.card.show{
  transform:translateY(0);
  opacity:1;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:15px;
}

.card button{
  margin-top:15px;
  padding:10px;
  border:none;
  background:#ff6600;
  color:#fff;
  border-radius:20px;
  cursor:pointer;
}

/* CONTACT */
.contact{
  max-width:500px;
  margin:40px auto;
  padding:30px;
  background:#f9f9f9;
  border-radius:20px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

/* FOOTER */
footer{
  background:#111;
  color:#fff;
  text-align:center;
  padding:15px;
}
</style>
</head>

<body>

<header>
<h1>BALAJI UPVC</h1>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero" id="home">
<h2>Modern UPVC Windows & Doors</h2>
</section>

<section class="section" id="products">
<h2>Our Premium Products</h2>

<div class="products">

<div class="card reveal">
<img src="https://images.unsplash.com/photo-1588854337115-1c67d9247e4d">
<h3>Sliding Window</h3>
<button onclick="orderNow('Sliding Window')">Order Now</button>
</div>

<div class="card reveal">
<img src="https://images.unsplash.com/photo-1599423300746-b62533397364">
<h3>Casement Window</h3>
<button onclick="orderNow('Casement Window')">Order Now</button>
</div>

<div class="card reveal">
<img src="https://images.unsplash.com/photo-1560185127-6ed189bf02f4">
<h3>UPVC Door</h3>
<button onclick="orderNow('UPVC Door')">Order Now</button>
</div>

</div>
</section>

<section class="section" id="contact">
<h2>Contact Us</h2>
<div class="contact">
<input type="text" placeholder="Your Name">
<input type="tel" placeholder="Mobile Number">
<textarea placeholder="Your Message"></textarea>
<button>Send Message</button>
</div>
</section>

<footer>
© 2026 Balaji UPVC Windows & Doors
</footer>

<script>
function orderNow(product){
  var phone="9588217772";
  var message="Hello, I want to order "+product+" from Balaji UPVC.";
  window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message));
}

/* SCROLL REVEAL */
const cards = document.querySelectorAll('.reveal');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
},{ threshold: 0.2 });

cards.forEach(card => {
  observer.observe(card);
});
</script>

</body>
</html>
