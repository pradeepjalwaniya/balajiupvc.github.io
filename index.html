<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balaji UPVC Windows & Doors</title>

<meta name="description" content="Premium UPVC Windows & Doors in Kishangarh. Modern, stylish and durable solutions.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:linear-gradient(135deg,#ff6600,#ff944d);
  color:#333;
}

/* NAVBAR */
header{
  position:fixed;
  width:100%;
  top:0;
  left:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  z-index:1000;
  animation:slideDown 1s ease;
}

header h1{
  color:#fff;
  font-size:20px;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
  font-weight:500;
  transition:0.3s;
}

nav a:hover{
  color:#ff944d;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#fff;
  padding:20px;
  animation:fadeIn 2s ease;
}

.hero h2{
  font-size:40px;
  margin-bottom:20px;
}

.hero button{
  padding:12px 25px;
  border:none;
  background:#fff;
  color:#ff6600;
  font-weight:600;
  border-radius:30px;
  cursor:pointer;
  transition:0.4s;
}

.hero button:hover{
  transform:scale(1.1);
}

/* PRODUCTS */
.section{
  padding:80px 20px;
  background:#fff;
  text-align:center;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
  margin-top:40px;
}

.card{
  background:rgba(255,255,255,0.8);
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  transition:0.4s;
  animation:fadeUp 1.5s ease;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:15px;
}

.card h3{
  margin:15px 0;
}

.card button{
  padding:10px;
  border:none;
  background:#ff6600;
  color:#fff;
  border-radius:20px;
  cursor:pointer;
  transition:0.3s;
}

.card button:hover{
  background:#ff944d;
}

/* CONTACT */
.contact{
  max-width:500px;
  margin:40px auto;
  background:#f9f9f9;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

input, textarea{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

.contact button{
  width:100%;
  padding:10px;
  border:none;
  background:#ff6600;
  color:#fff;
  border-radius:20px;
  cursor:pointer;
}

/* FLOATING WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:#fff;
  padding:15px 18px;
  border-radius:50%;
  font-size:22px;
  text-decoration:none;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  animation:pulse 2s infinite;
}

/* FOOTER */
footer{
  background:#111;
  color:#fff;
  text-align:center;
  padding:15px;
}

/* ANIMATIONS */
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes slideDown{
  from{transform:translateY(-100%);}
  to{transform:translateY(0);}
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}
</style>
</head>

<body>

<header>
<h1>BALAJI UPVC</h1>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero" id="home">
<h2>Modern UPVC Windows & Doors</h2>
<button onclick="document.getElementById('products').scrollIntoView()">Explore Products</button>
</section>

<section class="section" id="products">
<h2>Our Premium Products</h2>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1588854337115-1c67d9247e4d" alt="">
<h3>Sliding Window</h3>
<button onclick="orderNow('Sliding Window')">Order Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1599423300746-b62533397364" alt="">
<h3>Casement Window</h3>
<button onclick="orderNow('Casement Window')">Order Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1560185127-6ed189bf02f4" alt="">
<h3>UPVC Door</h3>
<button onclick="orderNow('UPVC Door')">Order Now</button>
</div>

</div>
</section>

<section class="section" id="contact">
<h2>Contact Us</h2>
<div class="contact">
<input type="text" placeholder="Your Name">
<input type="tel" placeholder="Mobile Number">
<textarea placeholder="Your Message"></textarea>
<button>Send Message</button>
</div>
</section>

<a class="whatsapp" href="https://wa.me/919982100135" target="_blank">💬</a>

<footer>
© 2026 Balaji UPVC Windows & Doors | Kishangarh
</footer>

<script>
function orderNow(product){
  var phone="9588217772";
  var message="Hello, I want to order "+product+" from Balaji UPVC.";
  window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message));
}
</script>

</body>
</html>
