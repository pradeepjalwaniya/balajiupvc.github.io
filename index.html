<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balaji UPVC Windows & Doors | Kishangarh</title>

<meta name="description" content="Premium UPVC Windows & Doors in Kishangarh. Sliding windows, casement windows & durable UPVC doors at best price.">
<meta name="keywords" content="UPVC Windows Kishangarh, UPVC Doors Ajmer, Sliding Window, Casement Window">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html{scroll-behavior:smooth;}
body{background:linear-gradient(135deg,#ff6600,#ff944d);color:#333}

/* NAVBAR */
header{
position:fixed;width:100%;top:0;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(10px);
display:flex;justify-content:space-between;
align-items:center;padding:15px 40px;
z-index:1000;color:#fff;
}
nav a{color:#fff;margin-left:20px;text-decoration:none;transition:.3s}
nav a:hover{color:#ff944d}

/* HERO */
.hero{
height:100vh;display:flex;
flex-direction:column;justify-content:center;
align-items:center;text-align:center;
color:#fff;padding:20px
}
.hero h2{font-size:40px;margin-bottom:20px}
.hero button{
padding:12px 25px;border:none;
background:#fff;color:#ff6600;
font-weight:600;border-radius:30px;
cursor:pointer;transition:.3s
}
.hero button:hover{transform:scale(1.1)}

/* SECTIONS */
.section{padding:80px 20px;background:#fff;text-align:center}
.products{
display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;margin-top:40px
}

/* CARD */
.card{
background:#fff;border-radius:20px;padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
transform:translateY(60px);opacity:0;
transition:all .8s ease
}
.card.show{transform:translateY(0);opacity:1}
.card img{width:100%;height:200px;object-fit:cover;border-radius:15px}
.card h3{margin:15px 0}
.card button{
padding:10px;border:none;background:#ff6600;
color:#fff;border-radius:20px;cursor:pointer
}

/* CONTACT */
.contact{
max-width:500px;margin:40px auto;
background:#f9f9f9;padding:30px;
border-radius:20px;box-shadow:0 10px 20px rgba(0,0,0,0.1)
}
input,textarea{
width:100%;padding:10px;margin:10px 0;
border-radius:10px;border:1px solid #ccc
}
.contact button{
width:100%;padding:10px;border:none;
background:#ff6600;color:#fff;border-radius:20px;cursor:pointer
}

/* WHATSAPP */
.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:#fff;
padding:15px 18px;border-radius:50%;
font-size:22px;text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
animation:pulse 2s infinite
}

/* FOOTER */
footer{
background:#111;color:#fff;text-align:center;padding:15px
}

/* ANIMATION */
@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}
</style>
</head>

<body>

<header>
<h1>BALAJI UPVC</h1>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero" id="home">
<h2>Modern UPVC Windows & Doors</h2>
<button onclick="document.getElementById('products').scrollIntoView()">Explore Products</button>
</section>

<section class="section" id="products">
<h2>Our Premium Products</h2>

<div class="products">

<div class="card reveal">
<img src="https://images.unsplash.com/photo-1588854337115-1c67d9247e4d" alt="Sliding Window">
<h3>Sliding Window</h3>
<button onclick="orderNow('Sliding Window')">Order on WhatsApp</button>
</div>

<div class="card reveal">
<img src="https://images.unsplash.com/photo-1599423300746-b62533397364" alt="Casement Window">
<h3>Casement Window</h3>
<button onclick="orderNow('Casement Window')">Order on WhatsApp</button>
</div>

<div class="card reveal">
<img src="https://images.unsplash.com/photo-1560185127-6ed189bf02f4" alt="UPVC Door">
<h3>UPVC Door</h3>
<button onclick="orderNow('UPVC Door')">Order on WhatsApp</button>
</div>

</div>
</section>

<section class="section" id="contact">
<h2>Contact Us</h2>
<div class="contact">
<form onsubmit="return submitForm(event)">
<input type="text" placeholder="Your Name" required>
<input type="tel" placeholder="Mobile Number" required>
<textarea placeholder="Your Message" required></textarea>
<button type="submit">Send Message</button>
</form>
<p>📞 9982100135</p>
<p>📍 Ramner Road, Kishangarh, Ajmer</p>
</div>
</section>

<a class="whatsapp" href="https://wa.me/919982100135" target="_blank">💬</a>

<footer>
© 2026 Balaji UPVC Windows & Doors | Kishangarh
</footer>

<script>
function orderNow(product){
var phone="919982100135";
var message="Hello, I want to order "+product+" from Balaji UPVC.";
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message));
}

/* Scroll Reveal */
const cards=document.querySelectorAll('.card');
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){entry.target.classList.add('show');}
});
},{threshold:0.2});
cards.forEach(card=>observer.observe(card));

function submitForm(e){
e.preventDefault();
alert("Thank you! We will contact you soon.");
return false;
}
</script>

</body>
</html>
